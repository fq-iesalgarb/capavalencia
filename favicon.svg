<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradat de fons fosc alineat amb Tailwind slate-950 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Degradat vermell per al nucli -->
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Resplendor per a l'electró de valència -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cercle de fons -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="12" />

  <!-- Orbitai interna (Capa K) -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" stroke-dasharray="16 10" />
  
  <!-- Orbita de valència exterior (Capa L/M) -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#ef4444" stroke-width="10" stroke-opacity="0.6" />

  <!-- Nucli atòmic -->
  <circle cx="256" cy="256" r="48" fill="url(#nucleusGrad)" stroke="#fca5a5" stroke-width="4" />
  <text x="256" y="262" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold">B</text>

  <!-- Electrons interns (Blaus) -->
  <circle cx="256" cy="166" r="14" fill="#38bdf8" stroke="#0f172a" stroke-width="3" />
  <circle cx="256" cy="346" r="14" fill="#38bdf8" stroke="#0f172a" stroke-width="3" />

  <!-- Electró de valència exterior (Vermell / Groc actiu) -->
  <g filter="url(#glow)">
    <circle cx="421" cy="256" r="20" fill="#ef4444" stroke="#ffffff" stroke-width="4" />
    <circle cx="421" cy="256" r="8" fill="#fef08a" />
  </g>
</svg>